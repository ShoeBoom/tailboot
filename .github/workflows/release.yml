name: Build Tailboot release

on:
  push:
    tags:
      - "v*"
  schedule:
    # First day of each month at 04:17 UTC. Avoid the start of the hour, when jobs
    # are more likely to be delayed by GitHub Actions load.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: tailboot-release-pages
  cancel-in-progress: false

jobs:
  release-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      iso_name: ${{ steps.metadata.outputs.iso_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_commit: ${{ steps.metadata.outputs.release_commit }}
      create_tag: ${{ steps.metadata.outputs.create_tag }}
      config_offset: ${{ steps.config.outputs.offset }}
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils bzip2 ca-certificates cpio curl debian-archive-keyring \
            debootstrap file gh \
            grub-efi-amd64-bin grub-pc-bin isolinux mtools \
            rsync squashfs-tools syslinux-common wget xorriso xz-utils zstd

          curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb" \
            --output "${RUNNER_TEMP}/live-build.deb"
          sudo apt-get install --yes --no-install-recommends \
            "${RUNNER_TEMP}/live-build.deb"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - name: Define release artifact
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            release_tag=${PUSHED_TAG}
            create_tag=false
          else
            release_tag="v$(date -u +%Y.%m.%d.%H%M%S)"
            create_tag=true
          fi

          if ! printf '%s\n' "${release_tag}" \
            | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]$'; then
            echo "Release tags must use UTC CalVer: vYYYY.MM.DD.HHMMSS." >&2
            exit 1
          fi

          iso_name="tailboot-${release_tag}-amd64.iso"
          echo "iso_name=${iso_name}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${create_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build ISO
        run: |
          # Keep the directory runner-owned so the checksum step can write to it.
          mkdir -p image/dist
          sudo ./image/scripts/build-iso.sh "${{ steps.metadata.outputs.iso_name }}"

      - name: Verify image contents and boot records
        run: ./image/scripts/verify-iso.sh "image/dist/${{ steps.metadata.outputs.iso_name }}"

      - name: Verify configuration with Debian's NetworkManager
        run: sudo chroot image/chroot /bin/sh < image/scripts/test-configure.sh

      - name: Set up Node for ISO patch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read configuration byte offset
        id: config
        run: |
          offset=$(./image/scripts/config-offset.sh "image/dist/${{ steps.metadata.outputs.iso_name }}")
          echo "offset=${offset}" >> "${GITHUB_OUTPUT}"

      - name: Test browser customizer against the built ISO
        run: |
          node --test tailboot-iso.test.ts
          node image/scripts/test-iso-patch.ts \
            "image/dist/${{ steps.metadata.outputs.iso_name }}" "${{ steps.config.outputs.offset }}"

      - name: Create checksum
        working-directory: image/dist
        run: sha256sum "${{ steps.metadata.outputs.iso_name }}" > "${{ steps.metadata.outputs.iso_name }}.sha256"

      - name: Upload ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-iso
          path: |
            image/dist/${{ steps.metadata.outputs.iso_name }}
            image/dist/${{ steps.metadata.outputs.iso_name }}.sha256
          compression-level: 0

  build-cli:
    needs: release-iso
    strategy:
      matrix:
        include:
          - runner: windows-2025
            asset: tailboot-windows-x64.exe
          - runner: ubuntu-24.04
            asset: tailboot-linux-x64
          - runner: ubuntu-24.04-arm
            asset: tailboot-linux-arm64
          - runner: macos-15
            asset: tailboot-macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-iso.outputs.release_commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Set up Zig for Windows
        if: runner.os == 'Windows'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1
        with:
          version: 0.16.0

      - name: Build CLI
        shell: bash
        env:
          SCRIPTC_CC: ${{ runner.os == 'Windows' && 'zigcc' || '' }}
          SCRIPTC_TARGET: ${{ runner.os == 'Windows' && 'x86_64-windows-gnu' || '' }}
          PUBLIC_TAILBOOT_ISO_NAME: ${{ needs.release-iso.outputs.iso_name }}
          PUBLIC_TAILBOOT_RELEASE: ${{ needs.release-iso.outputs.release_tag }}
          PUBLIC_TAILBOOT_CONFIG_OFFSET: ${{ needs.release-iso.outputs.config_offset }}
        run: |
          pnpm build:cli
          mv cli/dist/tailboot "cli/dist/${{ matrix.asset }}"

      - name: Upload CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.asset }}
          path: cli/dist/${{ matrix.asset }}

  publish-release:
    needs: [release-iso, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-iso.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.release-iso.outputs.release_commit }}
          CREATE_TAG: ${{ needs.release-iso.outputs.create_tag }}
          ISO_NAME: ${{ needs.release-iso.outputs.iso_name }}
        run: |
          if release=$(gh release view "${RELEASE_TAG}" --json isDraft,assets 2>/dev/null); then
            if [ "$(jq -r .isDraft <<< "${release}")" = "true" ]; then
              gh release upload "${RELEASE_TAG}" dist/* --clobber
              gh release edit "${RELEASE_TAG}" --draft=false
              exit 0
            fi

            assets=$(jq -r '.assets[].name' <<< "${release}")
            if grep -Fxq "${ISO_NAME}" <<< "${assets}" \
              && grep -Fxq "${ISO_NAME}.sha256" <<< "${assets}"; then
              # Only reuse the rebuilt offset if the published ISO is identical.
              gh release download "${RELEASE_TAG}" --pattern "${ISO_NAME}.sha256" \
                --dir "${RUNNER_TEMP}/tailboot-release"
              if ! cmp "dist/${ISO_NAME}.sha256" \
                "${RUNNER_TEMP}/tailboot-release/${ISO_NAME}.sha256"; then
                echo "The rebuilt ISO differs from the published release; refusing to deploy its offset." >&2
                exit 1
              fi
              exit 0
            fi

            echo "The release exists without both expected ISO assets; refusing to modify it." >&2
            exit 1
          fi

          if [ "${CREATE_TAG}" = "true" ]; then
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --target "${RELEASE_COMMIT}" \
              --title "Tailboot ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --title "Tailboot ${RELEASE_TAG}" \
              --verify-tag
          fi
          gh release edit "${RELEASE_TAG}" --draft=false

  build-site:
    needs: [release-iso, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-iso.outputs.release_tag }}

      - name: Build Astro site with the release metadata
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          out-dir: site/dist
          cache-dir: site/node_modules/.astro
        env:
          PUBLIC_TAILBOOT_ISO_NAME: ${{ needs.release-iso.outputs.iso_name }}
          PUBLIC_TAILBOOT_RELEASE: ${{ needs.release-iso.outputs.release_tag }}
          PUBLIC_TAILBOOT_CONFIG_OFFSET: ${{ needs.release-iso.outputs.config_offset }}

  deploy-site:
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
