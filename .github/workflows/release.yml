name: Build Tailboot release

on:
  push:
    tags:
      - "v*"
  schedule:
    # First day of each month at 04:17 UTC. Avoid the start of the hour, when jobs
    # are more likely to be delayed by GitHub Actions load.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: tailboot-release-pages
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils bzip2 ca-certificates cpio curl debian-archive-keyring \
            debootstrap file gh \
            grub-efi-amd64-bin grub-pc-bin isolinux mtools \
            rsync squashfs-tools syslinux-common wget xorriso xz-utils zstd

          curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb" \
            --output "${RUNNER_TEMP}/live-build.deb"
          sudo apt-get install --yes --no-install-recommends \
            "${RUNNER_TEMP}/live-build.deb"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Define release artifact
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            release_tag=${PUSHED_TAG}
            create_tag=false
          else
            release_tag="v$(date -u +%Y.%m.%d.%H%M%S)"
            create_tag=true
          fi

          if ! printf '%s\n' "${release_tag}" \
            | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]$'; then
            echo "Release tags must use UTC CalVer: vYYYY.MM.DD.HHMMSS." >&2
            exit 1
          fi

          iso_name="tailboot-${release_tag}-amd64.iso"
          echo "iso_name=${iso_name}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${create_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build ISO
        run: |
          # Keep the directory runner-owned so the checksum step can write to it.
          mkdir -p image/dist
          sudo ./image/scripts/build-iso.sh "${{ steps.metadata.outputs.iso_name }}"

      - name: Verify image contents and boot records
        run: ./image/scripts/verify-iso.sh "image/dist/${{ steps.metadata.outputs.iso_name }}"

      - name: Verify configuration with Debian's NetworkManager
        run: sudo chroot image/chroot /bin/sh < image/scripts/test-configure.sh

      - name: Set up Node for ISO patch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read configuration byte offset
        id: config
        run: |
          offset=$(./image/scripts/config-offset.sh "image/dist/${{ steps.metadata.outputs.iso_name }}")
          echo "offset=${offset}" >> "${GITHUB_OUTPUT}"

      - name: Test browser customizer against the built ISO
        run: |
          node --test tailboot-iso.test.ts
          node image/scripts/test-iso-patch.ts \
            "image/dist/${{ steps.metadata.outputs.iso_name }}" "${{ steps.config.outputs.offset }}"

      - name: Create base ISO checksum
        id: checksum
        working-directory: image/dist
        run: |
          sha256sum "${{ steps.metadata.outputs.iso_name }}" > "${{ steps.metadata.outputs.iso_name }}.sha256"
          echo "sha256=$(cut -d ' ' -f1 "${{ steps.metadata.outputs.iso_name }}.sha256")" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Test CLI against the verified ISO
        working-directory: cli
        env:
          TAILBOOT_TEST_ISO: ${{ github.workspace }}/image/dist/${{ steps.metadata.outputs.iso_name }}
          TAILBOOT_TEST_OFFSET: ${{ steps.config.outputs.offset }}
          TAILBOOT_TEST_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: go test ./...

      - name: Build CLI binaries with verified release metadata
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          ISO_NAME: ${{ steps.metadata.outputs.iso_name }}
          ISO_SHA256: ${{ steps.checksum.outputs.sha256 }}
          CONFIG_OFFSET: ${{ steps.config.outputs.offset }}
        run: |
          ./cli/build.sh
          ./cli/dist/tailboot-${RELEASE_TAG}-linux-amd64 --version

      - name: Build Astro site with the same release metadata
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          out-dir: site/dist
          cache-dir: site/node_modules/.astro
        env:
          PUBLIC_TAILBOOT_ISO_NAME: ${{ steps.metadata.outputs.iso_name }}
          PUBLIC_TAILBOOT_RELEASE: ${{ steps.metadata.outputs.release_tag }}
          PUBLIC_TAILBOOT_CONFIG_OFFSET: ${{ steps.config.outputs.offset }}

      - name: Stage and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.release_commit }}
          CREATE_TAG: ${{ steps.metadata.outputs.create_tag }}
        run: |
          # Never reuse or modify an existing release, including an earlier draft.
          # A failed run can be retried with a new tag.
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "This release already exists; use a new tag." >&2
            exit 1
          fi
          tag_args=(--target "${RELEASE_COMMIT}")
          if [ "${CREATE_TAG}" = "false" ]; then
            tag_args+=(--verify-tag)
          fi
          gh release create "${RELEASE_TAG}" --draft \
            "${tag_args[@]}" --title "Tailboot ${RELEASE_TAG}" --notes "Tailboot ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" image/dist/* cli/dist/*

          # Confirm every uploaded asset matches before making the release public.
          staging="${RUNNER_TEMP}/tailboot-staged"
          gh release download "${RELEASE_TAG}" --dir "${staging}"
          for asset in image/dist/* cli/dist/*; do
            cmp "$asset" "${staging}/$(basename "$asset")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --latest

  deploy-site:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
