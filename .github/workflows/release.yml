name: Build Tailboot release

on:
  push:
    tags:
      - "v*"
  schedule:
    # First day of each month at 04:17 UTC. Avoid the start of the hour, when jobs
    # are more likely to be delayed by GitHub Actions load.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: tailboot-release-pages
  cancel-in-progress: false

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      iso_name: ${{ steps.metadata.outputs.iso_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      config_offset: ${{ steps.config.outputs.offset }}
      release_commit: ${{ steps.metadata.outputs.release_commit }}
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils bzip2 ca-certificates cpio curl debian-archive-keyring \
            debootstrap file gh \
            grub-efi-amd64-bin grub-pc-bin isolinux mtools \
            rsync squashfs-tools syslinux-common wget xorriso xz-utils zstd

          curl --fail --silent --show-error --location \
            "https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb" \
            --output "${RUNNER_TEMP}/live-build.deb"
          sudo apt-get install --yes --no-install-recommends \
            "${RUNNER_TEMP}/live-build.deb"

      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Define release artifact
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            release_tag=${PUSHED_TAG}
            create_tag=false
          else
            release_tag="v$(date -u +%Y.%m.%d.%H%M%S)"
            create_tag=true
          fi

          if ! printf '%s\n' "${release_tag}" \
            | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])\.([01][0-9]|2[0-3])[0-5][0-9][0-5][0-9]$'; then
            echo "Release tags must use UTC CalVer: vYYYY.MM.DD.HHMMSS." >&2
            exit 1
          fi

          iso_name="tailboot-${release_tag}-amd64.iso"
          echo "iso_name=${iso_name}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=${create_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build ISO
        run: |
          # Keep the directory runner-owned so the checksum step can write to it.
          mkdir -p image/dist
          sudo ./image/scripts/build-iso.sh "${{ steps.metadata.outputs.iso_name }}"

      - name: Verify image contents and boot records
        run: ./image/scripts/verify-iso.sh "image/dist/${{ steps.metadata.outputs.iso_name }}"

      - name: Verify configuration with Debian's NetworkManager
        run: sudo chroot image/chroot /bin/sh < image/scripts/test-configure.sh

      - name: Set up Node for ISO patch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read configuration byte offset
        id: config
        run: |
          offset=$(./image/scripts/config-offset.sh "image/dist/${{ steps.metadata.outputs.iso_name }}")
          echo "offset=${offset}" >> "${GITHUB_OUTPUT}"

      - name: Test browser customizer against the built ISO
        run: |
          node --test tailboot-iso.test.ts
          node image/scripts/test-iso-patch.ts \
            "image/dist/${{ steps.metadata.outputs.iso_name }}" "${{ steps.config.outputs.offset }}"

      - name: Create checksum
        working-directory: image/dist
        run: sha256sum "${{ steps.metadata.outputs.iso_name }}" > "${{ steps.metadata.outputs.iso_name }}.sha256"

      - name: Write verified release metadata
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          ISO_NAME: ${{ steps.metadata.outputs.iso_name }}
          CONFIG_OFFSET: ${{ steps.config.outputs.offset }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          const isoName = process.env.ISO_NAME;
          const checksum = await readFile(`image/dist/${isoName}.sha256`, "utf8");
          await writeFile("image/dist/release.json", JSON.stringify({
            tag: process.env.RELEASE_TAG,
            isoName,
            sha256: checksum.split(" ")[0],
            configOffset: Number(process.env.CONFIG_OFFSET),
          }, null, 2) + "\n");
          JS

      - name: Stage verified ISO in a new draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.release_commit }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CREATE_TAG: ${{ steps.metadata.outputs.create_tag }}
          ISO_NAME: ${{ steps.metadata.outputs.iso_name }}
        run: |
          tag_args=()
          if [ "${CREATE_TAG}" = "false" ]; then
            tag_args+=(--verify-tag)
          fi
          # Creation fails if this release already exists. Never reuse or replace
          # assets from an earlier build, including an unfinished draft.
          gh release create "${RELEASE_TAG}" \
            "image/dist/${ISO_NAME}" "image/dist/${ISO_NAME}.sha256" \
            image/dist/release.json \
            --draft --target "${RELEASE_COMMIT}" \
            --notes "Source commit: ${RELEASE_COMMIT}. Workflow run: ${RELEASE_RUN_URL}." \
            --title "Tailboot ${RELEASE_TAG}" "${tag_args[@]}"

  build-cli:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build-iso.outputs.release_tag }}
      ISO_NAME: ${{ needs.build-iso.outputs.iso_name }}
      CLI_NAME: tailboot-${{ needs.build-iso.outputs.release_tag }}-${{ matrix.platform }}
    steps:
      - name: Check out the exact ISO source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-iso.outputs.release_commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pinned build dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Download the verified ISO and its metadata from the draft
        run: |
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true
          gh release download "${RELEASE_TAG}" --dir image/dist \
            --pattern "${ISO_NAME}" --pattern "${ISO_NAME}.sha256" --pattern release.json
          (cd image/dist && sha256sum --check "${ISO_NAME}.sha256")

      - name: Test and compile CLI with embedded Node and release metadata
        run: |
          pnpm test
          pnpm exec tsc --noEmit
          pnpm build:cli
          node cli/test-binary.ts cli/dist/tailboot \
            "image/dist/${ISO_NAME}" image/dist/release.json

      - name: Stage verified CLI and checksum in the draft
        run: |
          mv cli/dist/tailboot "cli/dist/${CLI_NAME}"
          (cd cli/dist && sha256sum "${CLI_NAME}" > "${CLI_NAME}.sha256")
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = true
          gh release upload "${RELEASE_TAG}" "cli/dist/${CLI_NAME}" "cli/dist/${CLI_NAME}.sha256"

  build-site:
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact ISO source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-iso.outputs.release_commit }}

      - name: Build Astro site with the release metadata
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6.1.2
        with:
          out-dir: site/dist
          cache-dir: site/node_modules/.astro
        env:
          PUBLIC_TAILBOOT_ISO_NAME: ${{ needs.build-iso.outputs.iso_name }}
          PUBLIC_TAILBOOT_RELEASE: ${{ needs.build-iso.outputs.release_tag }}
          PUBLIC_TAILBOOT_CONFIG_OFFSET: ${{ needs.build-iso.outputs.config_offset }}

  publish-release:
    # Promote the tested assets only after every build and upload succeeds.
    needs: [build-iso, build-cli, build-site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact ISO source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.build-iso.outputs.release_commit }}

      - name: Verify all uploaded assets and publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-iso.outputs.release_tag }}
          ISO_NAME: ${{ needs.build-iso.outputs.iso_name }}
          CONFIG_OFFSET: ${{ needs.build-iso.outputs.config_offset }}
        run: bash .github/scripts/publish-release.sh

  deploy-site:
    # A deployment failure can be retried alone using this run's Pages artifact.
    needs: [build-site, publish-release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
